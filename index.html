<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xadrez</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="board-wrapper">
      <div id="rank-labels" class="labels"></div>
      <div id="board"></div>
      <div id="file-labels" class="labels"></div>
    </div>

    <aside id="panel">
      <div id="turn-indicator"></div>
      <div id="status-message"></div>

      <div id="history-box">
        <table id="history-table">
          <thead><tr><th>#</th><th>Brancas</th><th>Pretas</th></tr></thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>

      <div id="history-nav">
        <button id="undo-btn" title="Voltar (←)">◀ Voltar</button>
        <button id="redo-btn" title="Avançar (→)">Avançar ▶</button>
      </div>

      <button id="new-game-btn">Nova Partida</button>
      <button id="setup-mode-btn">Editar Posição</button>
    </aside>
  </div>

  <!-- Modal de promoção -->
  <div id="promotion-overlay" class="hidden">
    <div id="promotion-modal">
      <p>Promover peão para:</p>
      <div id="promotion-choices"></div>
    </div>
  </div>

  <!-- Editor de posição -->
  <div id="setup-overlay" class="hidden">
    <div id="setup-panel">
      <h2>Editar Posição</h2>

      <div id="setup-body">
        <div id="editor-board"></div>

        <div id="setup-side">
          <div id="piece-palette"></div>

          <div id="turn-selector">
            <button class="turn-btn" data-turn="white">Brancas jogam</button>
            <button class="turn-btn" data-turn="black">Pretas jogam</button>
          </div>
        </div>
      </div>

      <div id="setup-error"></div>

      <div id="setup-actions">
        <button id="clear-board-btn">Limpar Tabuleiro</button>
        <button id="reset-board-btn">Posição Inicial</button>
        <button id="cancel-setup-btn">Cancelar</button>
        <button id="start-position-btn">Iniciar Partida</button>
      </div>
    </div>
  </div>

  <script src="js/engine.js"></script>
  <script src="js/history.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
